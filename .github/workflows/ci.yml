name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run build and tests
        run: npm test

      - name: Build modern
        run: npm run build:modern

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium

      - name: Reliability smokes
        env:
          CHROME_PATH: /usr/bin/chromium
        run: |
          node --test tests/phase-208-data-quality.test.js
          node --test tests/touch-targets.smoke.test.js
          node --test tests/mobile-overflow-controls.smoke.test.js
          node --test tests/tablet-tab-overflow.smoke.test.js
          node --test tests/safe-area.smoke.test.js
