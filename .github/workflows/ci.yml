name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run build and tests
        run: npm test

      - name: Build modern
        run: npm run build:modern

      - name: Resolve Chromium (reuse preinstalled browser)
        run: |
          CHROME_BIN="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No preinstalled browser found; falling back to apt install."
            sudo apt-get update
            sudo apt-get install -y chromium
            CHROME_BIN="$(command -v chromium)"
          fi
          echo "Using browser: $CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Reliability smokes
        run: |
          node --test tests/phase-208-data-quality.test.js
          node --test tests/touch-targets.smoke.test.js
          node --test tests/mobile-overflow-controls.smoke.test.js
          node --test tests/tablet-tab-overflow.smoke.test.js
          node --test tests/safe-area.smoke.test.js
          node --test tests/service-worker-update-reliability.test.js
          node --test tests/portfolio-report-readiness.test.js tests/v273-reporting-ui-contract.test.js
          node --test tests/reports-responsive-matrix.test.js
