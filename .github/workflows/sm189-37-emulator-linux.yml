name: SM189.37 emulators (Linux)

# Executa os suítes de Auth e Firestore Emulator em Linux para o branch de Preview QA.
# Não publica, não faz deploy, não usa secrets e não altera a branch principal.
on:
  workflow_dispatch:
  push:
    branches:
      - codex/preview/sm189-37-firebase-preview

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulators:
    name: Auth and Firestore emulators (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build modern assets
        run: npm run build:modern

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.32.1

      - name: Resolve Chromium
        run: |
          CHROME_BIN="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -z "$CHROME_BIN" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium
            CHROME_BIN="$(command -v chromium)"
          fi
          test -n "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Run Auth and Firestore emulator suite (v311)
        run: npm run test:auth-emulator

      - name: Run Auth access emulator suite
        run: npm run test:auth-access-emulator

      - name: Run M594 real rules emulator suite
        run: npm run test:m594-real-rules-emulator
