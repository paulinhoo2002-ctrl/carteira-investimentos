name: Preview Deploy
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar credenciais do Vercel
        id: verificar-credenciais
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "⚠️ VERCEL_TOKEN não configurado. Preview ignorado."
            echo "⚠️ Configure o secret VERCEL_TOKEN para ativar o deploy de preview."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "✅ VERCEL_TOKEN configurado. Preview será executado."
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build && npm run build:modern
      - uses: amondnet/vercel-action@v25
        if: ${{ steps.verificar-credenciais.outputs.has_token == 'true' && github.event_name == 'pull_request' }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=false'