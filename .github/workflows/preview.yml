name: Preview Deploy
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar credenciais do Vercel
        id: verificar-credenciais
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "ℹ️ VERCEL_TOKEN não configurado. Deploy de preview desabilitado."
            echo "ℹ️ Configure o secret VERCEL_TOKEN para ativar o preview de deploy."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "✅ VERCEL_TOKEN configurado. Deploy de preview pode ser autorizado separadamente."
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build && npm run build:modern
      - name: Informar status do preview
        run: |
          if [ "${{ steps.verificar-credenciais.outputs.has_token }}" = "true" ]; then
            echo "ℹ️ Preview de preview está disponível, mas requer autorização explícita para deploy."
            echo "ℹ️ Nenhum deploy será executado automaticamente neste workflow."
          else
            echo "ℹ️ Preview de preview desabilitado sem VERCEL_TOKEN."
          fi