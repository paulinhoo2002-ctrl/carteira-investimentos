name: Preview Deploy
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Job mantido com o mesmo nome para preservar o check "preview" existente.
  # Não compila nem implanta: o build já roda no CI e o deploy de preview
  # é feito pela integração Git da Vercel (somente branches não-main).
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Registrar política de preview
        run: |
          echo "Preview de branch: integração Git da Vercel (não é produção)."
          echo "Produção: somente a branch main."
          echo "Este workflow não compila nem implanta; o build é coberto pelo CI."
